<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Komiks Times</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --ink: #0a0a0a;
    --paper: #fafaf7;
    --paper2: #f0eee9;
    --rule: #0a0a0a;
    --mute: #6b6862;
    --accent: #c83a2c;
  }
  html, body { margin: 0; padding: 0; background: #e8e6e0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  *, *::before, *::after { box-sizing: border-box; }

  /* The "K O M I K S" wordmark style — wide letter-spacing serif/sans */
  .wm {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    letter-spacing: 0.5em;
    text-transform: uppercase;
  }
  .serif { font-family: 'Fraunces', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

  // ── shared atoms ─────────────────────────────────────────
  const StatusBar = ({ dark }) => (
    <div style={{
      height: 28, display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '0 18px', fontSize: 12, fontFamily: 'JetBrains Mono', fontWeight: 500,
      color: dark ? '#fafaf7' : '#0a0a0a',
    }}>
      <span>9:41</span>
      <span style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
        <span style={{ fontSize: 10 }}>●●●</span>
        <span>87</span>
      </span>
    </div>
  );

  // newspaper-style masthead
  const Masthead = ({ dark, small, withDate = true, issue = 'NO. 09' }) => (
    <div style={{
      borderTop: `1px solid ${dark ? '#fafaf7' : '#0a0a0a'}`,
      borderBottom: `1px solid ${dark ? '#fafaf7' : '#0a0a0a'}`,
      padding: small ? '8px 18px' : '14px 22px',
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      color: dark ? '#fafaf7' : '#0a0a0a',
    }}>
      <span className="mono" style={{ fontSize: 9, letterSpacing: 1.5, opacity: 0.7 }}>{issue}</span>
      <div style={{ textAlign: 'center', lineHeight: 0.95 }}>
        <div className="wm" style={{ fontSize: 9, opacity: 0.7, marginBottom: 3 }}>THE</div>
        <div className="serif" style={{ fontSize: small ? 22 : 30, fontWeight: 800, letterSpacing: -0.5 }}>Komiks Times</div>
      </div>
      <span className="mono" style={{ fontSize: 9, letterSpacing: 1.5, opacity: 0.7 }}>{withDate ? 'APR 27 · 26' : ''}</span>
    </div>
  );

  // X-through placeholder (still needed for video thumbs)
  const Thumb = ({ w, h, label, dark, style }) => (
    <div style={{
      position: 'relative', width: w, height: h,
      background: dark ? '#0a0a0a' : '#0a0a0a',
      overflow: 'hidden', flexShrink: 0, ...style,
    }}>
      <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0 }} preserveAspectRatio="none">
        <line x1="0" y1="0" x2="100%" y2="100%" stroke="#2a2a2a" strokeWidth="1"/>
        <line x1="100%" y1="0" x2="0" y2="100%" stroke="#2a2a2a" strokeWidth="1"/>
      </svg>
      {label && (
        <div className="mono" style={{
          position: 'absolute', left: 8, bottom: 6,
          fontSize: 9, color: '#fafaf7', letterSpacing: 1, textTransform: 'uppercase',
        }}>{label}</div>
      )}
    </div>
  );

  // ════════════════════════════════════════════════════════════
  // 01 — PARTICIPANT LANDING (mobile)
  // Brand-aligned: serif masthead, generous whitespace, B&W,
  // single deliberate task. Newspaper-y sections separated by rules.
  // ════════════════════════════════════════════════════════════
  const ParticipantLanding = () => (
    <div style={{ height: '100%', background: 'var(--paper)', display: 'flex', flexDirection: 'column' }}>
      <StatusBar />
      <Masthead />

      {/* date + edition strap */}
      <div className="mono" style={{
        display: 'flex', justifyContent: 'space-between',
        padding: '10px 22px', fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)',
        borderBottom: '1px solid var(--rule)',
      }}>
        <span>POST-FESTIVAL EDITION</span>
        <span>★ ★ ★</span>
      </div>

      {/* hero — newspaper headline */}
      <div style={{ padding: '32px 22px 28px' }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: 2, color: 'var(--accent)', marginBottom: 14 }}>
          ▸ READER SUBMISSIONS OPEN
        </div>
        <h1 className="serif" style={{
          margin: 0, fontSize: 52, fontWeight: 900, lineHeight: 0.92,
          letterSpacing: -1.5,
        }}>
          We were<br/>
          <em style={{ fontStyle: 'italic', fontWeight: 800 }}>there.</em><br/>
          Were<br/>you?
        </h1>
        <div style={{ marginTop: 18, fontSize: 14, lineHeight: 1.5, color: '#1a1a1a', maxWidth: 320 }}>
          Send us the footage from your phone. The best
          frames make the official aftermovie. No filters, no
          posing — just what actually happened.
        </div>
      </div>

      {/* primary action — wide flat button, like a newspaper banner */}
      <div style={{ padding: '0 22px' }}>
        <button style={{
          width: '100%', background: 'var(--ink)', color: 'var(--paper)',
          border: 'none', padding: '22px 18px', cursor: 'pointer',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          fontFamily: 'inherit',
        }}>
          <span className="serif" style={{ fontSize: 22, fontWeight: 600, letterSpacing: -0.3 }}>Submit your video</span>
          <span style={{ fontSize: 22 }}>→</span>
        </button>
        <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 8, textAlign: 'center' }}>
          MP4 · MOV · MAX 500 MB · ANONYMOUS OK
        </div>
      </div>

      {/* live counter as a single line of news */}
      <div style={{
        margin: '28px 22px 0', padding: '16px 0',
        borderTop: '1px solid var(--rule)', borderBottom: '1px solid var(--rule)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
      }}>
        <div>
          <div className="serif" style={{ fontSize: 36, fontWeight: 800, lineHeight: 1 }}>247</div>
          <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 2 }}>SUBMISSIONS</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="serif" style={{ fontSize: 36, fontWeight: 800, lineHeight: 1 }}>4.7<span style={{ fontSize: 18, opacity: 0.5 }}>/5</span></div>
          <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 2 }}>READER RATING</div>
        </div>
      </div>

      {/* secondary actions as masthead links */}
      <div style={{ padding: '20px 22px 0', display: 'flex', flexDirection: 'column', gap: 0 }}>
        {[
          ['Rate the show', '★'],
          ['Write a letter', '✎'],
          ['Read the gallery', '↗'],
        ].map(([t, i]) => (
          <div key={t} style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            padding: '14px 0', borderBottom: '1px solid #d8d4cc',
          }}>
            <span className="serif" style={{ fontSize: 18, fontWeight: 600 }}>{t}</span>
            <span style={{ fontSize: 16, color: 'var(--mute)' }}>{i}</span>
          </div>
        ))}
      </div>

      <div style={{ flex: 1 }}/>

      {/* footer — sociální linka jako u jejich webu */}
      <div className="mono" style={{
        padding: '16px 22px', fontSize: 9, letterSpacing: 1.5,
        color: 'var(--mute)', textAlign: 'center', borderTop: '1px solid #d8d4cc',
      }}>
        IG · FB · SC · RA · GOOUT
      </div>
    </div>
  );

  // ════════════════════════════════════════════════════════════
  // 02 — UPLOAD FLOW (mobile, 3 frames)
  // ════════════════════════════════════════════════════════════
  const UploadPick = () => (
    <div style={{ height: '100%', background: 'var(--paper)', display: 'flex', flexDirection: 'column' }}>
      <StatusBar />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 18px', borderBottom: '1px solid var(--rule)' }}>
        <span style={{ fontSize: 18 }}>←</span>
        <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>SUBMIT · STEP 1 / 3</span>
        <span style={{ fontSize: 16, color: 'var(--mute)' }}>?</span>
      </div>

      <div style={{ padding: '32px 22px 0' }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: 2, color: 'var(--accent)', marginBottom: 10 }}>
          ▸ PICK YOUR CLIP
        </div>
        <h1 className="serif" style={{ margin: 0, fontSize: 38, fontWeight: 800, lineHeight: 0.95, letterSpacing: -1 }}>
          What did<br/>you film?
        </h1>
      </div>

      {/* drop zone */}
      <div style={{ padding: '24px 22px 0' }}>
        <div style={{
          border: '1.5px dashed var(--rule)', padding: '40px 18px',
          textAlign: 'center', background: '#fff',
        }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>↑</div>
          <div className="serif" style={{ fontSize: 22, fontWeight: 700 }}>Tap to pick</div>
          <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 10 }}>
            OR DROP A FILE HERE
          </div>
        </div>
      </div>

      {/* recent from camera roll */}
      <div style={{ padding: '24px 22px 0' }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginBottom: 10 }}>
          FROM CAMERA ROLL · LAST 48H
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 4 }}>
          {['1:24','0:42','0:18','2:03','0:55','1:11'].map((t, i) => (
            <div key={i} style={{ position: 'relative' }}>
              <Thumb w="100%" h={88}/>
              <span className="mono" style={{ position: 'absolute', right: 4, bottom: 4, fontSize: 9, color: '#fff', background: '#0a0a0a', padding: '1px 4px' }}>{t}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ flex: 1 }}/>
      <div className="mono" style={{ padding: '16px 22px', fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', textAlign: 'center', borderTop: '1px solid #d8d4cc' }}>
        BY SUBMITTING YOU AGREE TO THE TERMS
      </div>
    </div>
  );

  const UploadTag = () => (
    <div style={{ height: '100%', background: 'var(--paper)', display: 'flex', flexDirection: 'column' }}>
      <StatusBar />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 18px', borderBottom: '1px solid var(--rule)' }}>
        <span style={{ fontSize: 18 }}>←</span>
        <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>SUBMIT · STEP 2 / 3</span>
        <span className="mono" style={{ fontSize: 10 }}>SKIP</span>
      </div>

      <div style={{ padding: '24px 22px 0' }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: 2, color: 'var(--accent)', marginBottom: 10 }}>
          ▸ ADD CONTEXT
        </div>
        <h1 className="serif" style={{ margin: 0, fontSize: 32, fontWeight: 800, lineHeight: 0.95, letterSpacing: -1 }}>
          Where & when?
        </h1>
      </div>

      {/* preview */}
      <div style={{ padding: '20px 22px 0' }}>
        <Thumb w="100%" h={180} label="0:42 · IMG_4823.MOV"/>
      </div>

      {/* tag chips */}
      <div style={{ padding: '20px 22px 0' }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginBottom: 8 }}>STAGE</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {[['main', true], ['second', false], ['outdoor', false], ['backstage', false]].map(([t, on]) => (
            <span key={t} className="mono" style={{
              fontSize: 11, letterSpacing: 1, padding: '6px 12px',
              border: '1px solid var(--rule)',
              background: on ? 'var(--ink)' : 'transparent', color: on ? 'var(--paper)' : 'var(--ink)',
              textTransform: 'uppercase',
            }}>{t}</span>
          ))}
        </div>
      </div>

      <div style={{ padding: '18px 22px 0' }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginBottom: 8 }}>VIBE</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {[['mosh pit', true], ['crowd', true], ['fire', false], ['set drop', false], ['quiet', false]].map(([t, on]) => (
            <span key={t} className="mono" style={{
              fontSize: 11, letterSpacing: 1, padding: '6px 12px',
              border: '1px solid var(--rule)',
              background: on ? 'var(--ink)' : 'transparent', color: on ? 'var(--paper)' : 'var(--ink)',
              textTransform: 'uppercase',
            }}>{t}</span>
          ))}
        </div>
      </div>

      <div style={{ padding: '18px 22px 0' }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)', marginBottom: 8 }}>YOUR HANDLE (OPTIONAL)</div>
        <input className="mono" placeholder="@anon" style={{
          width: '100%', border: 'none', borderBottom: '1px solid var(--rule)',
          background: 'transparent', padding: '8px 0', fontSize: 14,
          fontFamily: 'JetBrains Mono', outline: 'none',
        }}/>
      </div>

      <div style={{ flex: 1 }}/>
      <div style={{ padding: '0 22px 18px' }}>
        <button style={{
          width: '100%', background: 'var(--ink)', color: 'var(--paper)',
          border: 'none', padding: '20px 18px', cursor: 'pointer',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        }}>
          <span className="serif" style={{ fontSize: 20, fontWeight: 600 }}>Send it</span>
          <span style={{ fontSize: 18 }}>→</span>
        </button>
      </div>
    </div>
  );

  const UploadDone = () => (
    <div style={{ height: '100%', background: 'var(--paper)', display: 'flex', flexDirection: 'column' }}>
      <StatusBar />
      <div style={{ display: 'flex', justifyContent: 'flex-end', padding: '10px 18px', borderBottom: '1px solid var(--rule)' }}>
        <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>3 / 3 · DONE</span>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 22px' }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: 2, color: 'var(--accent)', marginBottom: 16 }}>
          ▸ FILED
        </div>
        <h1 className="serif" style={{ margin: 0, fontSize: 56, fontWeight: 900, lineHeight: 0.9, letterSpacing: -1.8 }}>
          You're<br/>on the<br/>record.
        </h1>
        <div style={{ marginTop: 22, fontSize: 14, lineHeight: 1.5, color: '#1a1a1a', maxWidth: 300 }}>
          Submission <span className="mono" style={{ background: '#0a0a0a', color: '#fff', padding: '1px 6px', fontSize: 12 }}>#0248</span> received.
          We'll watch it within 24h. If it makes the cut, you'll see your handle in the credits.
        </div>

        <div style={{ marginTop: 28, padding: '14px 0', borderTop: '1px solid var(--rule)', borderBottom: '1px solid var(--rule)', display: 'flex', justifyContent: 'space-between' }}>
          <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>STATUS</span>
          <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>● IN REVIEW</span>
        </div>
      </div>

      <div style={{ padding: '0 22px 24px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        <button style={{
          width: '100%', background: 'transparent', color: 'var(--ink)',
          border: '1.5px solid var(--ink)', padding: '16px 18px', cursor: 'pointer',
        }}>
          <span className="serif" style={{ fontSize: 17, fontWeight: 600 }}>Rate the show →</span>
        </button>
        <button className="mono" style={{
          width: '100%', background: 'transparent', color: 'var(--mute)',
          border: 'none', padding: '10px 18px', cursor: 'pointer',
          fontSize: 11, letterSpacing: 1.5,
        }}>
          SUBMIT ANOTHER CLIP
        </button>
      </div>
    </div>
  );

  // ════════════════════════════════════════════════════════════
  // 03 — ADMIN DASHBOARD (desktop, brand-aligned newsroom layout)
  // ════════════════════════════════════════════════════════════
  const AdminDashboard = () => (
    <div style={{ height: '100%', background: 'var(--paper)', display: 'flex', flexDirection: 'column', fontFamily: 'Inter' }}>
      {/* top admin bar */}
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '10px 24px', borderBottom: '1px solid var(--rule)', background: '#0a0a0a', color: '#fafaf7',
      }}>
        <span className="mono" style={{ fontSize: 10, letterSpacing: 2 }}>NEWSROOM · INTERNAL</span>
        <div style={{ display: 'flex', gap: 18 }}>
          <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>● LIVE</span>
          <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5 }}>EDITOR: ANNA</span>
        </div>
      </div>

      <Masthead small/>

      {/* date strap */}
      <div className="mono" style={{
        display: 'flex', justifyContent: 'space-between',
        padding: '8px 24px', fontSize: 10, letterSpacing: 1.5, color: 'var(--mute)',
        borderBottom: '1px solid var(--rule)',
      }}>
        <span>MON · APR 27 · 2026</span>
        <span>POST-FESTIVAL EDITION · DAY 1</span>
        <span>VOL. IX</span>
      </div>

      {/* big metric headline row — newspaper style */}
      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr 1fr', borderBottom: '1px solid var(--rule)' }}>
        {[
          { n: '247', l: 'Submissions, total', sub: '↑ 38 last hour', wide: true },
          { n: '12', l: 'Awaiting review', sub: 'queue', accent: true },
          { n: '4.7', l: 'Reader rating', sub: 'of 312 votes' },
          { n: '1,241', l: 'Attendees online', sub: 'live' },
        ].map((m, i) => (
          <div key={i} style={{
            padding: '20px 22px',
            borderRight: i < 3 ? '1px solid var(--rule)' : 'none',
          }}>
            <div className="mono" style={{ fontSize: 9, letterSpacing: 1.5, color: 'var(--mute)' }}>{m.l.toUpperCase()}</div>
            <div className="serif" style={{
              fontSize: m.wide ? 64 : 48, fontWeight: 900, lineHeight: 0.95, letterSpacing: -1.5,
              color: m.accent ? 'var(--accent)' : 'var(--ink)', marginTop: 6,
            }}>{m.n}</div>
            <div className="mono" style={{ fontSize: 10, letterSpacing: 1, color: 'var(--mute)', marginTop: 6 }}>{m.sub}</div>
          </div>
        ))}
      </div>

      {/* main: 3 columns like a newspaper */}
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr', minHeight: 0 }}>
        {/* col 1 — review queue */}
        <div style={{ borderRight: '1px solid var(--rule)', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '14px 22px 8px', borderBottom: '1px solid var(--rule)', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <span className="serif" style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.4 }}>The Queue</span>
            <span className="mono" style={{ fontSize: 10, letterSpacing: 1.5, color: 'var(--mute)' }}>12 PENDING</span>
          </div>
          {[
            { u: 'tom_94', t: '0:42', tag: 'main · mosh', flag: false },
            { u: 'lenka.k', t: '1:15', tag: 'second · set drop', flag: false },
            { u: 'mike', t: '0:18', tag: 'backstage · ?', flag: true },
            { u: 'eva', t: '2:01', tag: 'main · crowd', flag: false },
            { u: 'jp.0', t: '0:30', tag: 'outdoor · fire', flag: false },
          ].map((v, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 14,
              padding: '12px 22px', borderBottom: '1px solid #d8d4cc',
            }}>
              <Thumb w={88} h={50} label={v.t}/>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="serif" style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.1 }}>@{v.u}</div>
                <div className="mono" style={{ fontSize: 10, letterSpacing: 1, color: v.flag ? 'var(--accent)' : 'var(--mute)', marginTop: 3, textTransform: 'uppercase' }}>
                  {v.flag && '⚠ '}{v.tag}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 4 }}>
                <button className="mono" style={{ fontSize: 10, letterSpacing: 1, padding: '6px 10px', border: '1px solid var(--ink)', background: 'var(--ink)', color: 'var(--paper)', cursor: 'pointer' }}>APPROVE</button>
                <button className="mono" style={{ fontSize: 10, letterSpacing: 1, padding: '6px 10px', border: '1px solid var(--ink)', background: 'transparent', color: 'var(--ink)', cursor: 'pointer' }}>REJECT</button>
              </div>
            </div>
          ))}
        </div>

        {/* col 2 — chart */}
        <div style={{ borderRight: '1px solid var(--rule)', overflow: 'hidden', padding: '14px 22px' }}>
          <div className="serif" style={{ fontSize: 18, fontWeight: 800, letterSpacing: -0.3 }}>Tonight's Filing</div>
          <div className="mono" style={{ fontSize: 10, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 4 }}>SUBMISSIONS / HOUR · LAST 24H</div>
          <svg width="100%" height="120" viewBox="0 0 320 120" preserveAspectRatio="none" style={{ marginTop: 14 }}>
            {[6,8,4,9,12,18,24,38,32,28,22,16,12,8,5,3,2,4,6,9,14,20,26,30].map((v, i) => (
              <rect key={i} x={i*13.3} y={120-v*3} width="10" height={v*3} fill="#0a0a0a"/>
            ))}
            <line x1="0" y1="120" x2="320" y2="120" stroke="#0a0a0a" strokeWidth="1"/>
          </svg>
          <div className="mono" style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, letterSpacing: 1, color: 'var(--mute)', marginTop: 4 }}>
            <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>NOW</span>
          </div>

          <div style={{ marginTop: 26, paddingTop: 16, borderTop: '1px solid #d8d4cc' }}>
            <div className="serif" style={{ fontSize: 18, fontWeight: 800, letterSpacing: -0.3 }}>Top Filing Tags</div>
            {[['main · mosh', 64], ['main · set drop', 48], ['outdoor · crowd', 31], ['backstage', 18], ['outdoor · fire', 9]].map(([t, n], i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 0', borderBottom: '1px dotted #d8d4cc' }}>
                <div className="mono" style={{ fontSize: 11, flex: 1, letterSpacing: 0.5 }}>{t}</div>
                <div style={{ width: `${n}%`, height: 4, background: '#0a0a0a', maxWidth: 80 }}/>
                <div className="mono" style={{ fontSize: 11, width: 28, textAlign: 'right' }}>{n}</div>
              </div>
            ))}
          </div>
        </div>

        {/* col 3 — letters / feedback */}
        <div style={{ overflow: 'hidden', padding: '14px 22px' }}>
          <div className="serif" style={{ fontSize: 18, fontWeight: 800, letterSpacing: -0.3 }}>Letters to the Editor</div>
          <div className="mono" style={{ fontSize: 10, letterSpacing: 1.5, color: 'var(--mute)', marginTop: 4 }}>RECENT FEEDBACK · 312</div>

          {[
            { q: 'Sound on second stage was perfect. Bar was a mess though.', from: '@anon', stars: 5 },
            { q: 'Set times shifted twice without notice on Saturday.', from: '@p.k', stars: 3 },
            { q: 'Best line-up Komiks has done. Coming back.', from: '@tom_94', stars: 5 },
          ].map((l, i) => (
            <div key={i} style={{ padding: '14px 0', borderBottom: '1px solid #d8d4cc' }}>
              <div className="serif" style={{ fontSize: 14, lineHeight: 1.4, fontStyle: 'italic' }}>"{l.q}"</div>
              <div className="mono" style={{ fontSize: 10, letterSpacing: 1, color: 'var(--mute)', marginTop: 6, display: 'flex', justifyContent: 'space-between' }}>
                <span>— {l.from}</span>
                <span>{'★'.repeat(l.stars)}{'☆'.repeat(5-l.stars)}</span>
              </div>
            </div>
          ))}

          <button className="mono" style={{
            marginTop: 14, width: '100%', padding: '10px',
            border: '1px solid var(--ink)', background: 'transparent', color: 'var(--ink)',
            fontSize: 10, letterSpacing: 1.5, cursor: 'pointer',
          }}>EXPORT ALL → CSV</button>
        </div>
      </div>
    </div>
  );

  // ── App
  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="participant"
          title="Participant — mobile"
          subtitle="Brand-aligned hi-fi: serif masthead, generous whitespace, B&W with one red accent. Newspaper as a metaphor for The Komiks Times.">
          <DCArtboard id="p1" label="01 · Landing" width={380} height={780}>
            <ParticipantLanding/>
          </DCArtboard>
          <DCArtboard id="p2" label="02 · Upload — pick" width={380} height={780}>
            <UploadPick/>
          </DCArtboard>
          <DCArtboard id="p3" label="03 · Upload — tag" width={380} height={780}>
            <UploadTag/>
          </DCArtboard>
          <DCArtboard id="p4" label="04 · Filed" width={380} height={780}>
            <UploadDone/>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="admin"
          title="Admin — desktop newsroom"
          subtitle="Same DNA, different role. Three-column newspaper layout: queue · charts · letters.">
          <DCArtboard id="a1" label="Newsroom dashboard" width={1200} height={760}>
            <AdminDashboard/>
          </DCArtboard>
        </DCSection>

        <DCPostIt top={20} left={40} rotate={-3} width={230}>
          The metaphor: <b>Komiks Times = newspaper</b>. Submissions = filing a story. Admin = newsroom.
        </DCPostIt>
        <DCPostIt top={20} right={40} rotate={2} width={230}>
          Click 🡵 in any artboard's corner for fullscreen.
        </DCPostIt>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
