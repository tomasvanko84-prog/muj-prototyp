<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zápisník nápadů & schůzek</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #242433;
      --primary: #7c6af5;
      --primary-hover: #6a58e3;
      --primary-glow: rgba(124, 106, 245, 0.35);
      --danger: #f5546a;
      --text: #e8e8f0;
      --text-muted: #888899;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 80px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c6af5 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 8px;
    }

    /* Panel */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }

    /* Type selector */
    .type-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }
    .type-btn {
      flex: 1;
      padding: 11px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .type-btn.active {
      border-color: var(--primary);
      background: rgba(124, 106, 245, 0.15);
      color: var(--text);
    }
    .type-btn:hover:not(.active) {
      border-color: rgba(124, 106, 245, 0.4);
      color: var(--text);
    }

    /* Record center */
    .record-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Timer */
    .timer {
      font-size: 2.6rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .timer.visible { opacity: 1; }

    /* Waveform */
    .waveform {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 44px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .waveform.visible { opacity: 1; }
    .waveform-bar {
      width: 4px;
      background: var(--primary);
      border-radius: 3px;
      height: 8px;
    }
    .waveform.active .waveform-bar {
      animation: wave 1.1s ease-in-out infinite;
    }
    .waveform-bar:nth-child(1) { animation-delay: 0.0s; }
    .waveform-bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform-bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform-bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform-bar:nth-child(5) { animation-delay: 0.4s; }
    .waveform-bar:nth-child(6) { animation-delay: 0.3s; }
    .waveform-bar:nth-child(7) { animation-delay: 0.2s; }
    .waveform-bar:nth-child(8) { animation-delay: 0.1s; }
    .waveform-bar:nth-child(9) { animation-delay: 0.0s; }
    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 36px; }
    }

    /* Record button */
    .btn-record {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(124,106,245,0.35);
    }
    .btn-record:hover { background: var(--primary-hover); transform: scale(1.06); }
    .btn-record:active { transform: scale(0.97); }
    .btn-record.recording {
      background: var(--danger);
      box-shadow: 0 4px 24px rgba(245,84,106,0.4);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(245,84,106,0.4); }
      50% { box-shadow: 0 4px 40px rgba(245,84,106,0.0); }
    }

    /* Live transcript */
    .transcript-live {
      width: 100%;
      background: var(--surface2);
      border-radius: 12px;
      padding: 14px 16px;
      min-height: 58px;
      font-size: 0.93rem;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.3s;
      display: none;
    }
    .transcript-live.visible {
      display: block;
      opacity: 1;
    }
    #transcriptText { color: var(--text); }
    #interimText { color: var(--text-muted); font-style: italic; }

    /* Review panel */
    .review-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .review-panel.visible { display: flex; }

    .transcript-final {
      background: var(--surface2);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.93rem;
      line-height: 1.65;
      max-height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .transcript-final .empty-note {
      color: var(--text-muted);
      font-style: italic;
    }

    .title-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .title-input:focus { border-color: var(--primary); }
    .title-input::placeholder { color: var(--text-muted); }

    .review-actions {
      display: flex;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      padding: 11px 22px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      flex: 1;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); }

    /* Notice */
    .notice {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }
    .notice.error { color: #f5546a; }

    /* List */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .list-header h2 { font-size: 1.05rem; font-weight: 600; }
    .list-count { color: var(--text-muted); font-size: 0.83rem; }

    .list-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 44px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      font-size: 0.88rem;
      line-height: 1.7;
    }

    /* Recording item */
    .recording-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .recording-item:hover { border-color: rgba(124,106,245,0.3); }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 12px;
    }
    .item-title {
      font-weight: 600;
      font-size: 0.98rem;
      line-height: 1.3;
    }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-idea   { background: rgba(124,106,245,0.18); color: #a89af7; }
    .badge-meeting { background: rgba(76,175,130,0.18); color: #6fd4a8; }
    .badge-date   { background: var(--surface2); color: var(--text-muted); }

    .item-transcript {
      font-size: 0.87rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-transcript.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }

    .btn-expand {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .audio-player {
      flex: 1;
      height: 32px;
      accent-color: var(--primary);
      min-width: 0;
    }
    .btn-delete {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Zápisník nápadů & schůzek</h1>
    <p>Nahrajte hlas, automatický přepis a uložení lokálně v prohlížeči</p>
  </header>

  <div class="panel">
    <!-- Typ záznamu -->
    <div class="type-selector" id="typeSelector">
      <button class="type-btn active" data-type="idea" onclick="selectType('idea')">
        💡 Nápad
      </button>
      <button class="type-btn" data-type="meeting" onclick="selectType('meeting')">
        📋 Schůzka
      </button>
    </div>

    <!-- Nahrávání -->
    <div class="record-center" id="recordCenter">
      <div class="waveform" id="waveform">
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
      </div>

      <div class="timer" id="timer">0:00</div>

      <button class="btn-record" id="btnRecord" onclick="toggleRecording()" title="Spustit nahrávání">
        🎙️
      </button>

      <div class="transcript-live" id="transcriptLive">
        <span id="transcriptText"></span><span id="interimText"></span>
      </div>
    </div>

    <!-- Přehled po nahrání -->
    <div class="review-panel" id="reviewPanel">
      <div class="transcript-final" id="transcriptFinal"></div>
      <input type="text" class="title-input" id="titleInput"
             placeholder="Název záznamu (volitelné)…" maxlength="120">
      <div class="review-actions">
        <button class="btn btn-secondary" onclick="discardRecording()">Zahodit</button>
        <button class="btn btn-primary"   onclick="saveRecording()">Uložit záznam</button>
      </div>
    </div>

    <p class="notice" id="notice">
      Přepis funguje v Chrome a Edge · záznamy jsou uloženy jen ve vašem prohlížeči
    </p>
  </div>

  <!-- Seznam záznamů -->
  <div class="list-header">
    <h2>Záznamy</h2>
    <span class="list-count" id="listCount"></span>
  </div>
  <div id="recordingsList"></div>
</div>

<script>
  // ─── Stav ─────────────────────────────────────────────────────────────────
  let appState = 'idle';      // idle | recording | review
  let currentType = 'idea';
  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let recognition = null;
  let finalTranscript = '';
  let timerHandle = null;
  let elapsedSec = 0;
  let db = null;

  // ─── IndexedDB ────────────────────────────────────────────────────────────
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('napady-v1', 1);
      req.onupgradeneeded = e => {
        e.target.result.createObjectStore('recordings', { keyPath: 'id' });
      };
      req.onsuccess  = e => resolve(e.target.result);
      req.onerror    = e => reject(e.target.error);
    });
  }

  function dbPut(record) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').put(record);
      tx.oncomplete = resolve;
      tx.onerror = e => reject(e.target.error);
    });
  }

  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('recordings', 'readonly');
      const req = tx.objectStore('recordings').getAll();
      req.onsuccess = e => resolve(e.target.result);
      req.onerror   = e => reject(e.target.error);
    });
  }

  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').delete(id);
      tx.oncomplete = resolve;
      tx.onerror    = e => reject(e.target.error);
    });
  }

  // ─── Typ záznamu ──────────────────────────────────────────────────────────
  function selectType(type) {
    if (appState !== 'idle') return;
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.type === type)
    );
  }

  // ─── Časovač ──────────────────────────────────────────────────────────────
  function startTimer() {
    elapsedSec = 0;
    renderTimer();
    timerHandle = setInterval(() => { elapsedSec++; renderTimer(); }, 1000);
  }

  function stopTimer() {
    clearInterval(timerHandle);
    timerHandle = null;
  }

  function renderTimer() {
    const m = Math.floor(elapsedSec / 60);
    const s = elapsedSec % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }

  // ─── Speech recognition ───────────────────────────────────────────────────
  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;

    finalTranscript = '';
    recognition = new SR();
    recognition.lang = 'cs-CZ';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript + ' ';
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      document.getElementById('transcriptText').textContent = finalTranscript;
      document.getElementById('interimText').textContent = interim;
    };

    recognition.onerror = e => {
      if (e.error === 'not-allowed') {
        setNotice('Přístup k mikrofonu byl zamítnut.', true);
      }
    };

    // Automatické restartování (prohlížeč zastaví po pauze)
    recognition.onend = () => {
      if (appState === 'recording' && recognition) {
        try { recognition.start(); } catch (_) {}
      }
    };

    try { recognition.start(); } catch (_) {}
  }

  function stopRecognition() {
    if (!recognition) return;
    recognition.onend = null;
    try { recognition.stop(); } catch (_) {}
    recognition = null;
  }

  // ─── Nahrávání ────────────────────────────────────────────────────────────
  async function toggleRecording() {
    if (appState === 'idle')      await startRecording();
    else if (appState === 'recording') stopRecording();
  }

  async function startRecording() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setNotice('Nepodařilo se získat mikrofon: ' + e.message, true);
      return;
    }

    // Vybere podporovaný MIME typ
    const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg', 'audio/mp4', '']
      .find(t => t === '' || MediaRecorder.isTypeSupported(t));

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());
      showReview();
    };

    mediaRecorder.start(500);
    appState = 'recording';

    // UI
    const btn = document.getElementById('btnRecord');
    btn.classList.add('recording');
    btn.title = 'Zastavit nahrávání';
    btn.textContent = '⏹';

    document.getElementById('waveform').classList.add('visible', 'active');
    document.getElementById('timer').classList.add('visible');
    document.getElementById('transcriptLive').classList.add('visible');
    lockTypeSelector(true);

    startTimer();
    startRecognition();
  }

  function stopRecording() {
    appState = 'stopped';
    stopRecognition();
    stopTimer();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  function showReview() {
    appState = 'review';

    document.getElementById('recordCenter').style.display = 'none';

    const tf = document.getElementById('transcriptFinal');
    if (finalTranscript.trim()) {
      tf.innerHTML = `<p>${esc(finalTranscript.trim())}</p>`;
    } else {
      tf.innerHTML = '<p class="empty-note">Žádný přepis — prohlížeč nepodporuje Speech API nebo mikrofon nebyl aktivní pro přepis.</p>';
    }

    document.getElementById('titleInput').value = '';
    document.getElementById('reviewPanel').classList.add('visible');

    lockTypeSelector(false);
    setTimeout(() => document.getElementById('titleInput').focus(), 50);
  }

  async function saveRecording() {
    const rawTitle = document.getElementById('titleInput').value.trim();
    const now = new Date();
    const dateStr = now.toLocaleString('cs-CZ', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    const title = rawTitle || `${currentType === 'idea' ? 'Nápad' : 'Schůzka'} ${dateStr}`;

    await dbPut({
      id:         Date.now().toString(),
      title,
      type:       currentType,
      date:       now.toISOString(),
      transcript: finalTranscript.trim(),
      duration:   elapsedSec,
      audioBlob,
    });

    audioBlob = null;
    resetUI();
    renderList();
  }

  function discardRecording() {
    audioBlob = null;
    resetUI();
  }

  function resetUI() {
    appState = 'idle';

    document.getElementById('recordCenter').style.display = '';
    document.getElementById('reviewPanel').classList.remove('visible');

    const btn = document.getElementById('btnRecord');
    btn.classList.remove('recording');
    btn.title = 'Spustit nahrávání';
    btn.textContent = '🎙️';

    document.getElementById('waveform').classList.remove('visible', 'active');
    document.getElementById('timer').classList.remove('visible');
    document.getElementById('transcriptLive').classList.remove('visible');
    document.getElementById('transcriptText').textContent = '';
    document.getElementById('interimText').textContent = '';

    lockTypeSelector(false);
    setNotice('Přepis funguje v Chrome a Edge · záznamy jsou uloženy jen ve vašem prohlížeči');
  }

  function lockTypeSelector(locked) {
    const sel = document.getElementById('typeSelector');
    sel.style.opacity = locked ? '0.45' : '1';
    sel.style.pointerEvents = locked ? 'none' : '';
  }

  function setNotice(msg, isError = false) {
    const el = document.getElementById('notice');
    el.textContent = msg;
    el.className = 'notice' + (isError ? ' error' : '');
  }

  // ─── Seznam záznamů ───────────────────────────────────────────────────────
  const blobUrls = {}; // id → object URL (kvůli úklidu)

  async function renderList() {
    const records = await dbGetAll();
    records.sort((a, b) => b.date.localeCompare(a.date));

    const list  = document.getElementById('recordingsList');
    const count = document.getElementById('listCount');

    // Revokování starých blob URL
    Object.values(blobUrls).forEach(url => URL.revokeObjectURL(url));
    Object.keys(blobUrls).forEach(k => delete blobUrls[k]);

    count.textContent = records.length ? `${records.length} záznam${records.length > 4 ? 'ů' : records.length > 1 ? 'y' : ''}` : '';

    if (!records.length) {
      list.innerHTML = '<div class="list-empty">Zatím žádné záznamy.<br>Stiskněte 🎙️ a nahrajte svůj první nápad!</div>';
      return;
    }

    list.innerHTML = '';
    for (const r of records) {
      list.appendChild(buildItem(r));
    }
  }

  function buildItem(r) {
    const div = document.createElement('div');
    div.className = 'recording-item';

    const date = new Date(r.date).toLocaleString('cs-CZ', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    const dur = r.duration
      ? `${Math.floor(r.duration / 60)}:${(r.duration % 60).toString().padStart(2, '0')}`
      : null;

    const transcript = r.transcript || '(žádný přepis)';
    const isLong = transcript.length > 220;

    div.innerHTML = `
      <div class="item-header">
        <div style="min-width:0">
          <div class="item-title">${esc(r.title)}</div>
          <div class="item-meta">
            <span class="badge ${r.type === 'idea' ? 'badge-idea' : 'badge-meeting'}">
              ${r.type === 'idea' ? '💡 Nápad' : '📋 Schůzka'}
            </span>
            <span class="badge badge-date">${date}</span>
            ${dur ? `<span class="badge badge-date">⏱ ${dur}</span>` : ''}
          </div>
        </div>
        <button class="btn-delete" onclick="deleteRec('${r.id}')">Smazat</button>
      </div>
      <div class="item-transcript" id="tr-${r.id}">${esc(transcript)}</div>
      ${isLong ? `<button class="btn-expand" id="exp-${r.id}" onclick="toggleExpand('${r.id}')">Zobrazit celý přepis ↓</button>` : ''}
      <div class="item-actions">
        <audio class="audio-player" id="aud-${r.id}" controls preload="none"></audio>
        <button class="btn-delete" onclick="downloadRec('${r.id}')">Stáhnout</button>
      </div>
    `;

    if (r.audioBlob) {
      const url = URL.createObjectURL(r.audioBlob);
      blobUrls[r.id] = url;
      div.querySelector(`#aud-${r.id}`).src = url;
    } else {
      div.querySelector(`#aud-${r.id}`).style.display = 'none';
      div.querySelector('[onclick^="downloadRec"]').style.display = 'none';
    }

    return div;
  }

  function toggleExpand(id) {
    const tr  = document.getElementById(`tr-${id}`);
    const btn = document.getElementById(`exp-${id}`);
    const expanded = tr.classList.toggle('expanded');
    btn.textContent = expanded ? 'Skrýt ↑' : 'Zobrazit celý přepis ↓';
  }

  async function deleteRec(id) {
    if (!confirm('Opravdu smazat tento záznam?')) return;
    if (blobUrls[id]) { URL.revokeObjectURL(blobUrls[id]); delete blobUrls[id]; }
    await dbDelete(id);
    renderList();
  }

  async function downloadRec(id) {
    const url = blobUrls[id];
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = `zaznam-${id}.webm`;
    a.click();
  }

  // ─── Helpers ──────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  openDB()
    .then(d => { db = d; renderList(); })
    .catch(e => setNotice('Chyba při otevírání databáze: ' + e.message, true));
</script>
</body>
</html>
